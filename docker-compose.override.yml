services:
  db:
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder # Use builder stage for faster builds in dev
    command: python -m django runserver 0.0.0.0:8000
    env_file:
      - core/.env.local
    environment:
      DEBUG: "True"
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: core.settings
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase/firebase-sa.json
    volumes:
      - .:/app
      - media_data:/app/media
      # Le dossier, jamais le fichier : un bind-mount vers un chemin absent
      # ne fait pas échouer Docker, il CRÉE un répertoire vide à cet endroit.
      # C'est ce qui a fait taire le push quand le projet Firebase a changé.
      - ../AGENTS/firebase:/run/secrets/firebase:ro
    ports:
      - "8000:8000"
    depends_on:
      - db
    stdin_open: true
    tty: true
    develop:
      watch:
        - path: .
          target: /app
          action: sync
          ignore:
            - "**/.git"
            - "**/db.sqlite3"
            - "**/media"
            - "**/__pycache__"
            - "**/.venv"
            - "*.pyc"

volumes:
  media_data:
