services:
  db:
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder # Use builder stage for faster builds in dev
    command: python -m django runserver 0.0.0.0:8000
    env_file:
      - core/.env.local
    environment:
      DEBUG: "True"
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: core.settings
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    stdin_open: true
    tty: true
    develop:
      watch:
        - path: .
          target: /app
          action: sync
          ignore:
            - "**/.git"
            - "**/db.sqlite3"
            - "**/media"
            - "**/__pycache__"
            - "**/.venv"
            - "*.pyc"

volumes:
  media_data:
